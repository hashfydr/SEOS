name: SEOS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: seos-app/package-lock.json

      - name: Install Dependencies
        run: |
          cd seos-app
          npm ci

      - name: Type Check (TypeScript)
        run: |
          cd seos-app
          npx tsc -b --noEmit

      - name: Run Automated Tests
        run: |
          cd seos-app
          npm test

      - name: Build Application
        run: |
          cd seos-app
          npm run build

  backend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests/
